    제휴사가 아니라 일반 구매대행이므로 사실과 다르다(판매자=Charis G,
    쿠팡 payload 도 deliveryMethod=AGENT_BUY 로 신고). 아마존 워드마크·로고 색상
    사용도 제휴 오인 소지가 있어 제거했다. 구매처로서의 "미국 아마존" 언급은
    사실 서술이라 본문 텍스트로만 유지한다(로고·워드마크 스타일 금지).

  ★문의 창구는 채널 중립어 "문의하기" 로 통일 — 쿠팡 전용어를 쓰면 네이버·11번가
    재사용 시 또 갈라진다(종전 "1:1 문의" ↔ banner_4 "판매자 문의하기" 불일치).

  ★삭제분 이관: 취소·반품 기준 → banner_4 "반품 / 교환 기준" 으로 일원화(중복이었음).
    분리배송 박스별 반품배송비 → banner_4 "추가 비용이 발생할 수 있는 경우" 로 이동.

  수정 후 반드시 재렌더: python -m backend.purchase.scripts.render_coupang_banners
